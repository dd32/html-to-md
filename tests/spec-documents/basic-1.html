<title>Basic plaintext conversion</title>

<section id="empty document">
<pre></pre>
<script type="text/x-markdown"></script>
</section>

<section id="basic plain text">
<pre>Just a test</pre>
<script type="text/x-markdown">Just a test</script>
</section>

<section id="p tag with plaintext and <b>">
<pre><p>Howdy, <b>Markdown</b>!</p></pre>
<script type="text/x-markdown">Howdy, **Markdown**!</script>
</section>

<section id="p tag with plaintext and <strong>">
	<pre><p>Howdy, <b>Markdown</b>!</p></pre>
	<script type="text/x-markdown">Howdy, **Markdown**!</script>
</section>

<section id="p tag with plaintext and <strong> and <em>">
	<pre><p>The <em>dog</em> did it, I <strong>swear</strong>!</p></pre>
	<script type="text/x-markdown">The _dog_ did it, I **swear**!</script>
</section>

<section id="p tag with plaintext and <s>">
	<pre><p>That was <s>twenty</s> ten dollars.</p></pre>
	<script type="text/x-markdown">That was ~twenty~ ten dollars.</script>
</section>

<section id="p tag with plaintext and <q>">
	<pre><p>Years ago, I said that <q>nobody will build an HTML parser in PHP.</q></p></pre>
	<script type="text/x-markdown">Years ago, I said that “nobody will build an HTML parser in PHP.”</script>
</section>

<section id="p tag with plaintext and <b> with *">
	<pre><p>The <b>*</b> is special.</p></pre>
	<script type="text/x-markdown">The **\*** is special.</script>
</section>

<section id="p tag with plaintext and <i> with _">
	<pre><p>The <i>_</i> is special.</p></pre>
	<script type="text/x-markdown">The _\__ is special.</script>
</section>
